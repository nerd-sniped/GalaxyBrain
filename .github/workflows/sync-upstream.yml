name: Sync from upstream template

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to sync into"
        required: false
        default: "main"
  schedule:
    # Runs weekly on Monday at 08:00 UTC — remove or adjust as you like
    - cron: "0 8 * * 1"

jobs:
  sync:
    runs-on: ubuntu-latest
    # Skip if this IS the upstream template repo
    if: github.repository != 'nerd-sniped/GalaxyBrain'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/nerd-sniped/GalaxyBrain.git || true
          git fetch upstream

      - name: Check for upstream changes
        id: check
        run: |
          BEHIND=$(git rev-list --count HEAD..upstream/main)
          echo "behind=$BEHIND" >> $GITHUB_OUTPUT
          echo "Commits behind upstream: $BEHIND"

      - name: Create PR with upstream changes
        if: steps.check.outputs.behind != '0'
        uses: actions/github-script@v7
        env:
          BASE_BRANCH: ${{ inputs.branch || 'main' }}
        with:
          script: |
            const { execSync } = require('child_process');
            const branch = 'upstream-sync-' + new Date().toISOString().slice(0, 10);

            execSync(`git config user.name "github-actions[bot]"`);
            execSync(`git config user.email "github-actions[bot]@users.noreply.github.com"`);
            execSync(`git checkout -b ${branch}`);
            execSync(`git merge upstream/main --no-edit --allow-unrelated-histories`, { stdio: 'inherit' });
            execSync(`git push origin ${branch}`);

            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `chore: sync updates from GalaxyBrain template`,
              head: branch,
              base: process.env.BASE_BRANCH,
              body: [
                '## Upstream template sync',
                '',
                'This PR was automatically created to bring in updates from the [GalaxyBrain](https://github.com/nerd-sniped/GalaxyBrain) template.',
                '',
                '**Review the diff carefully** before merging — your vault notes and any customisations you have made are not touched by template changes, but config or component files may conflict.',
                '',
                '> To stop receiving these: delete or disable the `.github/workflows/sync-upstream.yml` workflow.',
              ].join('\n'),
            });

            console.log(`Created PR #${pr.data.number}: ${pr.data.html_url}`);
